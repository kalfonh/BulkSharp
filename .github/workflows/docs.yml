name: Docs

on:
  push:
    branches: [main]
    # Deliberately unfiltered. A path filter is evaluated against the push diff, which is
    # unreliable for force-pushes and rewritten history — a skipped run leaves the site
    # showing whatever was published last. Rebuilding on every push to main is cheap and
    # removes that failure mode.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet tool install -g docfx

      - run: docfx docs/docfx.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
